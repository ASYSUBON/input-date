<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลงทะเบียนข้อมูลเปิดงาน</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      padding: 20px;
      margin: 0;
    }
    .form-card {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 0 auto;
    }
    h2 {
      color: #06C755; /* สีเขียว LINE */
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #333;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #06C755;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #05b34c;
    }
    .status {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="form-card">
    <h2>ฟอร์มลงทะเบียน</h2>
    <form id="profileForm">
      <input type="hidden" id="userId" name="userId">

      <div class="form-group">
        <label for="firstname">ชื่อ</label>
        <input type="text" id="firstname" required placeholder="สมชาย">
      </div>

      <div class="form-group">
        <label for="lastname">นามสกุล</label>
        <input type="text" id="lastname" required placeholder="ใจดี">
      </div>

      <div class="form-group">
        <label for="phone">เบอร์โทรศัพท์</label>
        <input type="tel" id="phone" required placeholder="0812345678">
      </div>

      <div class="form-group">
        <label for="email">อีเมล</label>
        <input type="email" id="email" placeholder="example@email.com (ถ้ามี)">
      </div>

      <div class="form-group">
        <label for="address">ที่อยู่</label>
        <textarea id="address" rows="3" required placeholder="ที่อยู่ปัจจุบัน..."></textarea>
      </div>
      
      <div class="form-group">
        <label for="symptom">อาการเสีย (ถ้ามี)</label>
        <textarea id="symptom" rows="2" placeholder="ระบุอาการเสีย เช่น เปิดไม่ติด, หน้าจอแตก"></textarea>
      </div>
      
      <div class="form-group">
        <label for="note">หมายเหตุ / อื่นๆ</label>
        <input type="text" id="note" placeholder="ข้อมูลเพิ่มเติม (ถ้ามี)">
      </div>

      <button type="submit" id="submitBtn">บันทึกข้อมูล</button>
    </form>
    <p class="status" id="statusText">กำลังเชื่อมต่อ LINE...</p>
  </div>

  <script>
    // ** ใส่ LIFF ID ของคุณที่นี่ **
    const MY_LIFF_ID = "2011022561-Fpo3Cz4V"; 

    async function main() {
      try {
        // เริ่มต้นใช้งาน LIFF
        await liff.init({ liffId: MY_LIFF_ID });

        if (liff.isLoggedIn()) {
          // ดึงข้อมูล Profile ของผู้ใช้
          const profile = await liff.getProfile();
          document.getElementById('userId').value = profile.userId;
          document.getElementById('statusText').innerText = "เชื่อมต่อ LINE สำเร็จ";
        } else {
          // ถ้ายังไม่ได้ Login ให้บังคับ Login
          liff.login();
        }
      } catch (error) {
        console.error("LIFF Initialization failed", error);
        document.getElementById('statusText').innerText = "เกิดข้อผิดพลาดในการเชื่อมต่อ LINE";
      }
    }

    // จัดการการกดส่งฟอร์ม
document.getElementById('profileForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  // 1. ดึงค่าจากฟอร์มทุกช่องเก็บไว้ในตัวแปร
  const userId = document.getElementById('userId').value;
  const firstname = document.getElementById('firstname').value;
  const lastname = document.getElementById('lastname').value;
  const phone = document.getElementById('phone').value;
  const email = document.getElementById('email').value;
  const address = document.getElementById('address').value;
  const symptom = document.getElementById('symptom').value; // ดึงค่าอาการเสีย
  const note = document.getElementById('note').value;

  // 2. รวบรวมข้อมูลสำหรับส่งไป Backend/Database (ถ้ามี)
  const formData = {
    userId,
    firstname,
    lastname,
    phone,
    email,
    address,
    symptom,
    note
  };

  try {
    // 3. เช็คว่าเปิดผ่านแอป LINE หรือไม่
    if (liff.isInClient()) {
      
      // 4. ส่งข้อความสรุปข้อมูลเข้าห้องแชท
      await liff.sendMessages([
        {
          type: 'text',
          text: `📋 **รายละเอียดการลงทะเบียน**\n` +
                `👤 ชื่อ-นามสกุล: ${firstname} ${lastname}\n` +
                `📞 เบอร์โทร: ${phone}\n` +
                `📧 อีเมล: ${email || '-'}\n` +        // ถ้าไม่กรอก จะแสดง -
                `🏠 ที่อยู่: ${address}\n` +
                `🛠️ อาการเสีย: ${symptom || '-'}\n` + // แสดงอาการเสีย
                `📝 อื่นๆ/หมายเหตุ: ${note || '-'}`
        }
      ]);
    }

    alert("บันทึกข้อมูลเรียบร้อยแล้ว!");

  } catch (error) {
    console.error("Error sending message:", error);
    alert("เกิดข้อผิดพลาดในการส่งข้อความ: " + error.message);
  } finally {
    // 5. ปิดหน้าต่าง LIFF
    if (liff.isInClient()) {
      liff.closeWindow();
    }
  }
});

    // เรียกการทำงานหลัก
    main();
  </script>
</body>
</html>
